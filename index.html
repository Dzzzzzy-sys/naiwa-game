<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>奶蛙接奶瓶</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f0f9eb;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-box {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 800px;
            background: linear-gradient(180deg, #e8f5e9 0%, #c8e6c9 100%);
            overflow: hidden;
        }
        .info-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            color: #2e7d32;
            z-index: 10;
            background: rgba(255,255,255,0.3);
        }
        #frog {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
            z-index: 5;
            transition: left 0.05s linear;
        }
        .fall-item {
            position: absolute;
            font-size: 36px;
            z-index: 3;
        }
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: white;
        }
        .modal h2 {
            font-size: 28px;
            margin-bottom: 16px;
        }
        .modal p {
            font-size: 18px;
            margin-bottom: 24px;
        }
        .btn {
            padding: 12px 32px;
            background: #66bb6a;
            border: none;
            border-radius: 24px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:active {
            background: #4caf50;
        }
        .hide {
            display: none;
        }
    </style>
</head>
<body>
    <div id="game-box">
        <div class="info-bar">
            <div>分数: <span id="score">0</span></div>
            <div>时间: <span id="time">60</span>s</div>
        </div>

        <div id="frog">🐸</div>

        <!-- 开始界面 -->
        <div id="start-modal" class="modal">
            <h2>奶蛙接奶瓶</h2>
            <p>接住奶瓶赚分，躲开炸弹！</p>
            <button class="btn" onclick="startGame()">开始游戏</button>
        </div>

        <!-- 结束界面 -->
        <div id="end-modal" class="modal hide">
            <h2>游戏结束</h2>
            <p>最终得分: <span id="final-score">0</span></p>
            <button class="btn" onclick="startGame()">再来一局</button>
        </div>
    </div>

    <script>
        const gameBox = document.getElementById('game-box');
        const frog = document.getElementById('frog');
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const startModal = document.getElementById('start-modal');
        const endModal = document.getElementById('end-modal');
        const finalScoreEl = document.getElementById('final-score');

        let score = 0;
        let timeLeft = 60;
        let gameRunning = false;
        let timer = null;
        let spawnTimer = null;
        let fallItems = [];
        let frogX = 50;
        const frogWidth = 48;

        function updateFrogPosition() {
            frog.style.left = frogX + '%';
        }

        function spawnItem() {
            if (!gameRunning) return;
            
            const item = document.createElement('div');
            item.className = 'fall-item';
            
            const rand = Math.random();
            let type, points;
            if (rand < 0.7) {
                type = '🍼';
                points = 10;
            } else if (rand < 0.9) {
                type = '🥛';
                points = 30;
            } else {
                type = '💣';
                points = -20;
            }
            
            item.textContent = type;
            item.dataset.points = points;
            
            const left = Math.random() * 90 + 5;
            item.style.left = left + '%';
            item.style.top = '-40px';
            
            gameBox.appendChild(item);
            fallItems.push({
                el: item,
                top: -40,
                left: left,
                points: points,
                speed: 2 + Math.random() * 2
            });
        }

        function updateItems() {
            if (!gameRunning) return;
            
            const boxHeight = gameBox.clientHeight;
            const frogBottom = boxHeight - 60;
            const frogLeftPx = (frogX / 100) * gameBox.clientWidth - frogWidth / 2;
            const frogRightPx = frogLeftPx + frogWidth;

            for (let i = fallItems.length - 1; i >= 0; i--) {
                const item = fallItems[i];
                item.top += item.speed;
                item.el.style.top = item.top + 'px';

                const itemLeftPx = (item.left / 100) * gameBox.clientWidth;
                const itemRightPx = itemLeftPx + 36;
                const itemBottom = item.top + 36;

                if (itemBottom >= frogBottom && item.top <= frogBottom + 48) {
                    if (itemRightPx >= frogLeftPx && itemLeftPx <= frogRightPx) {
                        score += item.points;
                        if (score < 0) score = 0;
                        scoreEl.textContent = score;
                        
                        item.el.remove();
                        fallItems.splice(i, 1);
                        continue;
                    }
                }

                if (item.top > boxHeight) {
                    item.el.remove();
                    fallItems.splice(i, 1);
                }
            }

            requestAnimationFrame(updateItems);
        }

        function startGame() {
            score = 0;
            timeLeft = 60;
            scoreEl.textContent = 0;
            timeEl.textContent = 60;
            frogX = 50;
            updateFrogPosition();
            
            fallItems.forEach(item => item.el.remove());
            fallItems = [];
            
            startModal.classList.add('hide');
            endModal.classList.add('hide');
            gameRunning = true;

            timer = setInterval(() => {
                timeLeft--;
                timeEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            spawnTimer = setInterval(spawnItem, 800);
            
            updateItems();
        }

        function endGame() {
            gameRunning = false;
            clearInterval(timer);
            clearInterval(spawnTimer);
            finalScoreEl.textContent = score;
            endModal.classList.remove('hide');
        }

        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;
            if (e.key === 'ArrowLeft') {
                frogX = Math.max(5, frogX - 4);
            } else if (e.key === 'ArrowRight') {
                frogX = Math.min(95, frogX + 4);
            }
            updateFrogPosition();
        });

        let touchStartX = 0;
        gameBox.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
        });

        gameBox.addEventListener('touchmove', (e) => {
            if (!gameRunning) return;
            e.preventDefault();
            const touchX = e.touches[0].clientX;
            const diff = touchX - touchStartX;
            const boxWidth = gameBox.clientWidth;
            frogX += (diff / boxWidth) * 100;
            frogX = Math.max(5, Math.min(95, frogX));
            touchStartX = touchX;
            updateFrogPosition();
        });

        gameBox.addEventListener('click', (e) => {
            if (!gameRunning) return;
            const clickX = e.clientX;
            const boxMid = gameBox.getBoundingClientRect().left + gameBox.clientWidth / 2;
            if (clickX < boxMid) {
                frogX = Math.max(5, frogX - 6);
            } else {
                frogX = Math.min(95, frogX + 6);
            }
            updateFrogPosition();
        });
    </script>
</body>
</html>
